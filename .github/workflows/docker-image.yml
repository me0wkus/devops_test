name: Tests and publishing docker image

on:
  push:
    branches: ["main"]

jobs:

  smoke-test:
    name: Test for PostgreSQL & Docker
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d blog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        volumes:
          - postgres_data:/var/lib/postgresql/data

    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t app-under-test .
        
      - name: Run test container
        run: |
          docker run -d \
            --network host \
            -e DATABASE_URL="postgresql://ci_user:ci_password@localhost:5432/db" \
            --name app-container \
            app-under-test
          sleep 10
          
      - name: Install test dependencies
        run: pip install psycopg2-binary requests
      
      - name: Execute container verification
        run: |
          # Проверка работы контейнера
          if ! docker inspect app-container --format='{{.State.Status}}' | grep -q "running"; then
            echo "Container failed to start"
            docker logs app-container
            exit 1
          fi
          
          # Проверка подключения к БД изнутри runner
          python -c "
          import psycopg2
          import os
          try:
              conn = psycopg2.connect(
                  host='localhost',
                  dbname='blog',
                  user='user',
                  password='password'
              )
              print('✅ DB connection successful')
              conn.close()
          except Exception as e:
              print(f'❌ DB connection failed: {str(e)}')
              raise
          "
          
          # Проверка healthcheck endpoint (пример для FastAPI/Flask)
          python -c "
          import requests
          try:
              response = requests.get('http://localhost:8080/health', timeout=5)
              response.raise_for_status()
              print(f'✅ Health check passed: {response.json()}')
          except Exception as e:
              print(f'❌ Health check failed: {str(e)}')
              raise
          "
      
      - name: Cleanup
        if: always()
        run: |
          docker stop app-container || true
          docker rm app-container || true

  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: [smoke-test]
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ secrets.DOCKERHUB_NAMESPACE }}/${{ secrets.DOCKERHUB_REP }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
